name: zutrade
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run ./scripts/zu setup}
      POSTGRES_USER: ${POSTGRES_USER:?Run ./scripts/zu setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/zu setup}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:?Run ./scripts/zu setup}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run ./scripts/zu setup}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # PostgreSQL 18 image stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
      - ./postgres/00-runtime.sh:/docker-entrypoint-initdb.d/00-runtime.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
volumes:
  postgres_data:
